<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="utf-8" />
    <title>[Lovinoes.de]</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <meta name="title" content="[Lovinoes.de]" />
    <meta name="keywords" content="Lovinoes, Lovinor, developer, Linux, self-hosting, tech, Germany, projects, programming, gaming, software, coding, sysadmin, PC building, scripting" />
    <meta name="author" content="Lovinoes" />
    <meta name="language" content="en" />
    <meta name="robots" content="index, follow" />
    <meta name="referrer" content="same-origin" />

    <meta name="theme-color" content="#FFFFFF" />
    <meta name="color-scheme" content="dark" />
    <meta name="darkreader-lock" />

    <!-- Link previews (Discord, Twitter, ...) only show the page title, in the theme color.
         Crawlers don't run JavaScript, so nginx's SSI picks the title per page. ("\/status" is
         SSI for the literal string "/status"; a bare "/..." would be read as a regex.) -->
    <!--# if expr="$request_uri = \/status" --><!--# set var="og_title" value="[Status]" --><!--# elif expr="$request_uri = \/projects" --><!--# set var="og_title" value="[Projects]" --><!--# else --><!--# set var="og_title" value="[Lovinoes.de]" --><!--# endif -->
    <meta property="og:title" content='<!--# echo var="og_title" default="[Lovinoes.de]" -->' />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="en_US" />

    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content='<!--# echo var="og_title" default="[Lovinoes.de]" -->' />
    <meta name="twitter:site" content="@Lovinoes" />
    <meta name="twitter:creator" content="@Lovinoes" />

    <!-- Warm up connections the home page needs right after the JS runs. The APIs are
         fetched with CORS, so their preconnects need crossorigin to be reused. -->
    <link rel="preconnect" href="https://api.lanyard.rest" crossorigin />
    <link rel="preconnect" href="https://api.github.com" crossorigin />
    <link rel="preconnect" href="https://cdn.discordapp.com" />

    <link rel="icon" type="image/png" href="/favicons/favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="/favicons/favicon.svg" />
    <link rel="shortcut icon" href="/favicons/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/favicons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="[Lovinoes]" />
    <link rel="manifest" href="/favicons/site.webmanifest" />

    <!-- nginx (ssi on) writes the response status in here, so the app can show the right
         error page. Anywhere else it stays a comment and the app ignores it. -->
    <meta name="lovinoes-status" content='<!--# echo var="status" default="" -->' />
    <style>
      /* Error fallback for when the app's JS can't load (e.g. rate limited). Hidden at
         first, so it never flashes when the app renders normally. */
      @keyframes lovinoes-show { to { visibility: visible; } }
      #error-fallback { visibility: hidden; animation: lovinoes-show 0s 2s forwards; position: fixed; inset: 0; padding: 25vh 16px 0; background: #0a0a0a; color: #fafafa; font-family: system-ui, sans-serif; text-align: center; }
      #error-fallback a { color: inherit; }
    </style>
  </head>
  <body>
    <!-- The fallback markup lives inside SSI on purpose: without SSI it's only comments. -->
    <div id="root"><!--# if expr="$status != 200" --><!--# set var="error_fallback" value="<div id='error-fallback'><h1>Error $status</h1><p><a href='/'>Back home</a></p></div>" --><!--# endif --><!--# echo var="error_fallback" encoding="none" default="" --></div>
    <noscript>This site needs JavaScript. Reach me at lovinoes@lovinoes.de.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
